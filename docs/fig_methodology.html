<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LLM-MetaOpt methodology</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 12px 4px; color: var(--foreground, #222); }
  .wrap { max-width: 940px; }
  svg text { fill: var(--foreground, #222); font-family: inherit; }
  .muted { fill: var(--muted-foreground, #666); }
  .stage { fill: var(--card, #fff); stroke: var(--border, #999); stroke-width: 1.4; cursor: pointer; transition: stroke .15s, stroke-width .15s; }
  .stage:hover, .stage.active { stroke: var(--accent, #3366cc); stroke-width: 2.4; }
  .cluster { fill: color-mix(in srgb, var(--muted-foreground, #888) 10%, transparent); stroke: var(--border, #999); stroke-width: 1.2; }
  .edge { fill: none; stroke: var(--foreground, #444); stroke-width: 1.6; }
  .edgeback { fill: none; stroke: var(--muted-foreground, #777); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .flow { animation: dashmove 1.1s linear infinite; }
  @keyframes dashmove { to { stroke-dashoffset: -20; } }
  .badge circle { fill: var(--card, #fff); stroke: var(--accent, #3366cc); stroke-width: 1.4; }
  .badge text { fill: var(--accent, #3366cc); font-size: 11px; font-weight: 600; }
  .elab { font-size: 10.5px; fill: var(--muted-foreground, #666); font-style: italic; }
  .note { fill: color-mix(in srgb, var(--muted-foreground, #888) 7%, transparent); stroke: var(--border, #bbb); stroke-width: 1; }
  .ntext { font-size: 11.5px; }
  .detail { margin-top: 10px; border: 1px solid var(--border, #ccc); border-radius: 8px; padding: 10px 14px; min-height: 64px; }
  .detail h3 { margin: 0 0 4px; font-size: 14px; color: var(--accent, #3366cc); }
  .detail p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--foreground, #222); }
  .hint { font-size: 11.5px; color: var(--muted-foreground, #777); margin: 6px 2px 0; }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 960 520" width="100%" role="img" aria-label="Fast-slow control architecture">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--foreground, #444)"></path>
    </marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted-foreground, #777)"></path>
    </marker>
  </defs>

  <!-- warm start -->
  <path class="edgeback" data-e="ws" d="M 110 118 L 110 52 L 485 52 L 485 292" marker-end="url(#ahd)"></path>
  <text class="elab" x="297" y="44" text-anchor="middle">epoch 0: proposed initial angles from the symbolic description of H</text>

  <!-- row 1 edges -->
  <path class="edge" data-e="p-t" d="M 192 152 L 232 152" marker-end="url(#ah)"></path>
  <path class="edge" data-e="t-s" d="M 302 152 L 332 152" marker-end="url(#ah)"></path>
  <path class="edge" data-e="s-e" d="M 452 152 L 482 152" marker-end="url(#ah)"></path>
  <path class="edge flow" data-e="loop" d="M 560 132 C 560 96, 280 96, 262 130" marker-end="url(#ah)"></path>
  <text class="elab" x="411" y="92" text-anchor="middle">k = 1, ..., Nw</text>
  <path class="edge" data-e="e-w" d="M 600 152 L 648 152" marker-end="url(#ah)"></path>
  <path class="edge" data-e="w-l" d="M 730 194 L 730 262 L 640 300" marker-end="url(#ah)"></path>

  <!-- feedback -->
  <path class="edgeback flow" data-e="fb" d="M 772 308 L 772 246 L 262 246 L 262 194" marker-end="url(#ahd)"></path>
  <text class="elab" x="517" y="238" text-anchor="middle">applied to the angles every Nw iterations</text>

  <!-- llm -> action -->
  <path class="edge" data-e="l-a" d="M 642 352 L 698 352" marker-end="url(#ah)"></path>

  <!-- row 1 nodes -->
  <g id="n1" class="nodeg">
    <rect class="stage" x="30" y="118" width="162" height="68" rx="6"></rect>
    <text x="111" y="146" text-anchor="middle" font-size="13">Variational problem</text>
    <text class="muted" x="111" y="166" text-anchor="middle" font-size="12.5">H, ansatz U(theta)</text>
    <g class="badge"><circle cx="30" cy="118" r="10"></circle><text x="30" y="122" text-anchor="middle">1</text></g>
  </g>

  <rect class="cluster" x="232" y="96" width="368" height="112" rx="8"></rect>
  <text class="elab" x="416" y="110" text-anchor="middle">fast loop, Nw iterations at local speed</text>
  <g id="n2" class="nodeg">
    <rect class="stage" x="242" y="130" width="60" height="44" rx="5"></rect>
    <text x="272" y="157" text-anchor="middle" font-size="12.5">theta_k</text>
    <g class="badge"><circle cx="242" cy="130" r="10"></circle><text x="242" y="134" text-anchor="middle">2</text></g>
    <rect class="stage" x="332" y="130" width="120" height="44" rx="5"></rect>
    <text x="392" y="148" text-anchor="middle" font-size="12">SPSA step</text>
    <text class="muted" x="392" y="164" text-anchor="middle" font-size="11">theta - a_k * g_hat</text>
    <rect class="stage" x="482" y="130" width="108" height="44" rx="5"></rect>
    <text x="536" y="148" text-anchor="middle" font-size="12">E(theta_k)</text>
    <text class="muted" x="536" y="164" text-anchor="middle" font-size="11">&lt;psi|H|psi&gt;</text>
  </g>

  <g id="n3" class="nodeg">
    <rect class="stage" x="650" y="116" width="160" height="76" rx="6"></rect>
    <text x="730" y="142" text-anchor="middle" font-size="12.5">Telemetry window T_k</text>
    <text class="muted" x="730" y="160" text-anchor="middle" font-size="10.8">[E, ||grad E||, eta, Var(theta)]</text>
    <text class="muted" x="730" y="176" text-anchor="middle" font-size="10.8">summarises the last Nw steps</text>
    <g class="badge"><circle cx="650" cy="116" r="10"></circle><text x="650" y="120" text-anchor="middle">3</text></g>
  </g>

  <!-- row 2 nodes -->
  <g id="n4" class="nodeg">
    <rect class="stage" x="330" y="292" width="312" height="122" rx="8"></rect>
    <text x="486" y="316" text-anchor="middle" font-size="13">LLM meta-optimizer (slow loop)</text>
    <text class="muted" x="486" y="340" text-anchor="middle" font-size="12">system prompt + telemetry window as JSON</text>
    <text class="muted" x="486" y="360" text-anchor="middle" font-size="12">diagnosis, justification, expected effect</text>
    <text class="muted" x="486" y="380" text-anchor="middle" font-size="12">one JSON object, validated by a schema</text>
    <text class="muted" x="486" y="400" text-anchor="middle" font-size="11">temperature 0, fixed seed, latency measured per call</text>
    <g class="badge"><circle cx="330" cy="292" r="10"></circle><text x="330" y="296" text-anchor="middle">4</text></g>
  </g>

  <g id="n5" class="nodeg">
    <rect class="stage" x="700" y="312" width="140" height="80" rx="6"></rect>
    <text x="770" y="338" text-anchor="middle" font-size="12.5">Intervention a</text>
    <text class="muted" x="770" y="356" text-anchor="middle" font-size="11.5">eta scale x</text>
    <text class="muted" x="770" y="372" text-anchor="middle" font-size="11.5">sigma noise, restart</text>
    <g class="badge"><circle cx="700" cy="312" r="10"></circle><text x="700" y="316" text-anchor="middle">5</text></g>
  </g>

  <!-- audit strip -->
  <rect class="note" x="60" y="452" width="400" height="56" rx="6"></rect>
  <text class="ntext" x="76" y="476">Latency accounting: t_call measured per call,</text>
  <text class="ntext" x="76" y="494">failed calls included in the cost model.</text>
  <rect class="note" x="500" y="452" width="400" height="56" rx="6"></rect>
  <text class="ntext" x="516" y="476">XAI audit: declared effect vs observed effect,</text>
  <text class="ntext" x="516" y="494">diagnosis compared with the ground-truth regime.</text>
</svg>

<div class="detail" id="detail">
  <h3>Fast-slow control architecture</h3>
  <p>Click a stage to see what it does. Hover highlights the data flow. Dashed arrows are the two cross-loop couplings: the warm start at epoch 0 and the intervention applied every Nw iterations.</p>
</div>
<p class="hint">Matches Figure 1 of the manuscript (paper/fig_methodology.tex).</p>
</div>

<script>
const DETAILS = {
  1: ["1. Variational problem",
      "A Hamiltonian H and an ansatz U(theta) define the instance, for example the two-qubit Heisenberg model. The optimizer minimises E(theta) = <psi(theta)|H|psi(theta)>."],
  2: ["2. Fast loop (SPSA)",
      "The classical stochastic optimizer runs Nw iterations between two controller queries. Each step estimates the gradient with two energy evaluations and updates the angles at local speed, milliseconds per step."],
  3: ["3. Telemetry window",
      "After Nw steps the history is compressed into one JSON window: the energy series, its slope and spread, the gradient norm, the learning rate and the dispersion of theta. This is the only thing the controller ever sees."],
  4: ["4. LLM meta-optimizer (slow loop)",
      "One call every Nw iterations. The model receives the system prompt and the window and must answer with one JSON object: a diagnosis from a closed list of five regimes, a two-sentence justification anchored to the numbers, a predicted gap reduction and one intervention. Temperature 0 and a fixed seed keep it reproducible, and the per-call latency is measured because it is the central quantity of the cost model."],
  5: ["5. Intervention",
      "The only levers: scale the SPSA step size (eta_scale), inject Gaussian noise into every angle (noise_sigma) or restart the angles. If the call fails the action is a no-op, so a dead endpoint degrades the run to plain SPSA instead of killing it."]
};
const EDGES = {
  1: ["ws", "p-t"],
  2: ["p-t", "t-s", "s-e", "loop", "fb"],
  3: ["e-w", "w-l"],
  4: ["w-l", "l-a", "ws"],
  5: ["l-a", "fb"]
};
const detail = document.getElementById("detail");
function show(n) {
  const d = DETAILS[n];
  detail.innerHTML = "<h3>" + d[0] + "</h3><p>" + d[1] + "</p>";
  document.querySelectorAll(".nodeg").forEach(g => g.classList.toggle("active", g.id === "n" + n));
  document.querySelectorAll("[data-e]").forEach(e => e.classList.toggle("active", (EDGES[n] || []).includes(e.dataset.e)));
}
document.querySelectorAll(".nodeg").forEach(g => {
  const n = g.id.replace("n", "");
  g.addEventListener("click", () => show(n));
  g.addEventListener("mouseenter", () => show(n));
});
</script>
<style> .edge.active, .edgeback.active { stroke: var(--accent, #3366cc); stroke-width: 2.4; } </style>
</body>
</html>
